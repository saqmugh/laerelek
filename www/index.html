<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lærelek</title>
<style>
@font-face{font-family:"Andika";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/andika-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Andika";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/andika-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Grandstander";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/grandstander-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Grandstander";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/grandstander-latin-800-normal.woff2) format("woff2")}
html{-webkit-text-size-adjust:100%}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}.inp{-webkit-user-select:text;user-select:text}
/* Layout: one centered play column; profile picker → child home (subject tabs + module tiles) → game card over big answer buttons; parent area behind a gate */
:root{
  --bg:#e8f3fb; --surface:#ffffff; --ink:#1b3350; --muted:#5a7190; --line:#cde0ee;
  --sun:#ffc23a; --leaf:#26a165; --berry:#d4336b; --sea:#2a76d2; --plum:#7a4fd0; --orange:#d97f00; --teal:#0f8590;
  --ok-bg:#dcf5e8; --bad-bg:#fde3ea; --warn:#b5560b; --warn-bg:#fff0dc;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  --shadow:0 3px 0 rgba(27,51,80,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1b2a; --surface:#16293d; --ink:#eef5fb; --muted:#9fb5cb; --line:#26425e;
  --sun:#ffd25e; --leaf:#2f9d68; --berry:#d84579; --sea:#3b82e0; --plum:#8a62dc; --orange:#c97700; --teal:#13808a;
  --ok-bg:#163d2c; --bad-bg:#45192a; --warn:#ffb36b; --warn-bg:#3d2a12; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1b2a; --surface:#16293d; --ink:#eef5fb; --muted:#9fb5cb; --line:#26425e;
  --sun:#ffd25e; --leaf:#2f9d68; --berry:#d84579; --sea:#3b82e0; --plum:#8a62dc; --orange:#c97700; --teal:#13808a;
  --ok-bg:#163d2c; --bad-bg:#45192a; --warn:#ffb36b; --warn-bg:#3d2a12; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

/* header */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.5px;margin-right:auto;display:flex;align-items:baseline;gap:2px}
.logo b{color:var(--sea)} .logo i{font-style:normal;color:var(--berry)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.pill .st{color:var(--sun);font-size:20px;line-height:1}
.pill.btn:hover{border-color:var(--sea)}
.me{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700}
.me .av{width:38px;height:38px;font-size:24px}
.av{display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--sun) 35%,var(--surface));line-height:1}
.label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* profiles */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.kid{background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow)}
.kid:hover{border-color:var(--sea)}
.kid .av{width:76px;height:76px;font-size:46px}
.kid b{font-family:var(--display);font-size:22px;max-width:100%;overflow-wrap:anywhere}
.kid small{color:var(--muted);font-size:15px}
.kid.add{border-style:dashed;justify-content:center;color:var(--sea)}
.kid.add .av{background:var(--bg);font-family:var(--display);font-weight:800;color:var(--sea)}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:16px;align-self:center;padding:8px}

/* form */
.form{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
.inp{font:inherit;font-size:22px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px;width:100%;box-sizing:border-box}
.avs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.avs button{aspect-ratio:1;max-width:100%;border-radius:16px;border:3px solid transparent;background:var(--bg);font-size:30px;line-height:1}
.avs button[aria-pressed="true"]{border-color:var(--sea);background:color-mix(in srgb,var(--sea) 14%,var(--surface))}
.grades{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grades button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;font-family:var(--display);font-weight:800;font-size:20px}
.grades button[aria-pressed="true"]{border-color:var(--sea);background:var(--sea);color:#fff}
.err{color:var(--berry);font-size:15px;margin:0}

/* home */
.hello{font-size:28px}
.goal{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-size:16px}
.goal .gd{display:flex;gap:6px;margin-left:auto}
.goal .gd span{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px;color:#fff}
.goal .gd span.on{background:var(--leaf)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border-radius:999px;padding:10px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;border-radius:24px;padding:18px 16px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:160px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .12s}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.tile h3{font-size:23px}
.tile p{margin:0;font-size:15px;opacity:.95;line-height:1.3}
.tile .lv{margin-top:auto;align-self:flex-start;font-size:13px;font-weight:700;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 10px}
.c-sea{background:var(--sea)} .c-berry{background:var(--berry)} .c-plum{background:var(--plum)}
.c-leaf{background:var(--leaf)} .c-orange{background:var(--orange)} .c-teal{background:var(--teal)}

/* game */
.bar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.back{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.dots{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.dots span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots span.done{background:var(--sun)} .dots span.miss{background:var(--muted)} .dots span.now{outline:3px solid var(--sea);outline-offset:1px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:var(--shadow);transition:background .2s}
.card.ok{background:var(--ok-bg)}
.q{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.say{width:52px;height:52px;border-radius:50%;background:var(--sea);color:#fff;display:inline-grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.say svg{width:26px;height:26px}
.hero{font-size:84px;line-height:1.1}
.hero.letter{font-family:var(--body);font-weight:700;font-size:110px;line-height:1}
.hero.wordbig{font-family:var(--body);font-weight:700;font-size:52px;line-height:1.1;overflow-wrap:anywhere}
.sent{font-size:26px;font-weight:700;line-height:1.5;max-width:30ch}
.sent .blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--sea);margin:0 4px}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:40px;line-height:1.1;max-width:340px}
.items.five{display:grid;grid-template-columns:repeat(5,1fr);gap:4px 8px;font-size:34px;max-width:300px}
.expr{font-family:var(--display);font-weight:800;font-size:52px;font-variant-numeric:tabular-nums;letter-spacing:1px;overflow-wrap:anywhere}
.expr .op{display:inline-block;font-size:1.3em;line-height:.8;vertical-align:-.05em;padding:0 .05em}
.op.plus,.opword.plus{color:var(--leaf)} .op.minus,.opword.minus{color:var(--berry)} .op.times,.opword.times{color:var(--sea)} .op.div,.opword.div{color:var(--plum)}
.opword{font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.hintbtn{background:color-mix(in srgb,var(--sun) 35%,var(--surface));border:2px solid var(--sun);border-radius:999px;padding:6px 14px;font-weight:700}
.hintbtn:disabled{opacity:.45;cursor:default}
.hintbox{background:color-mix(in srgb,var(--sun) 24%,var(--surface));border-radius:16px;padding:10px 14px;font-size:17px;margin:0;max-width:36ch;text-align:left}
.hintbox small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.choice.removed{visibility:hidden}
.setup{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:18px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 button{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.seg3 button small{font-weight:400;color:var(--muted);font-size:13px}
.seg3 button[aria-pressed="true"]{border-color:var(--sea);background:color-mix(in srgb,var(--sea) 14%,var(--surface))}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.swatches button{aspect-ratio:1;max-width:100%;border-radius:50%;border:4px solid var(--surface);box-shadow:0 0 0 2px var(--line);font-size:12px;font-weight:700;color:var(--ink)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.filebtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.thumb{width:100%;max-width:320px;aspect-ratio:4/3;border-radius:16px;background-size:cover;background-position:center;border:2px solid var(--line)}
#bgimg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
#bgimg::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 62%,transparent)}
body.th-sky{--wash:#4da6ff} body.th-rosa{--wash:#ff6fae} body.th-mint{--wash:#2fcf8a} body.th-lilla{--wash:#9a6cf5} body.th-sol{--wash:#ffb21f} body.th-hav{--wash:#14b3c4}
body[class*="th-"]{--bg:color-mix(in srgb,var(--wash) 20%,var(--surface))}
.rank{display:flex;flex-direction:column;gap:8px}
.rank div{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:8px 12px}
.rank .av{width:36px;height:36px;font-size:22px}
.rank b{font-family:var(--display)} .rank span.r{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;text-align:right}
.seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seq span{font-family:var(--display);font-weight:800;font-size:30px;min-width:60px;padding:6px 10px;border-radius:14px;background:var(--bg);font-variant-numeric:tabular-nums}
.seq span.gap{background:none;border:3px dashed var(--sea);color:var(--sea)}
.story{font-size:21px;max-width:34ch;margin:0}
.clock{width:200px;max-width:100%;height:auto}
.pie{width:150px;max-width:100%;height:auto}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;font-variant-numeric:tabular-nums}
.fr i{font-style:normal;padding:0 4px}
.fr i:first-child{border-bottom:3px solid currentColor;padding-bottom:3px}
.fr i:last-child{padding-top:3px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choices.one{grid-template-columns:1fr}
.choice{background:var(--surface);border:3px solid var(--line);border-radius:22px;min-height:84px;padding:10px;font-family:var(--display);font-weight:800;font-size:38px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;transition:transform .1s;min-width:0;overflow-wrap:anywhere}
.choice.word{font-family:var(--body);font-weight:700;font-size:28px;letter-spacing:.04em}
.choice.phrase{font-family:var(--body);font-weight:700;font-size:22px;min-height:68px}
.choice.lower{font-family:var(--body)}
.choice:active{transform:translateY(2px)}
.choice.right{border-color:var(--leaf);background:var(--ok-bg)}
.choice.wrong{border-color:var(--berry);background:var(--bad-bg);opacity:.6}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.06)}}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slots span{width:40px;height:52px;border-bottom:4px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:32px}
.slots span.filled{border-color:var(--leaf);color:var(--leaf)}
.slots span.next{border-color:var(--sea)}
.tiles-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ltile{width:56px;height:60px;border-radius:16px;background:var(--surface);border:3px solid var(--line);font-weight:700;font-size:30px;box-shadow:var(--shadow)}
.ltile:disabled{visibility:hidden}

/* alphabet */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.abc button{background:var(--surface);border:2px solid var(--line);border-radius:16px;aspect-ratio:1;max-width:100%;font-weight:700;font-size:32px;box-shadow:var(--shadow)}
.abc button.sel{border-color:var(--plum);background:color-mix(in srgb,var(--plum) 16%,var(--surface))}
.abc button.nordic{color:var(--berry)}
.show{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap}
.show .pair{font-weight:700;font-size:96px;line-height:1}
.show .pair span{color:var(--muted);font-size:70px}
.show .word{font-size:26px;font-weight:700}

/* end */
.end .stars{font-size:46px;letter-spacing:4px;color:var(--sun)}
.end .stars .off{color:var(--line)}
.lvup{background:color-mix(in srgb,var(--sun) 30%,var(--surface));border-radius:16px;padding:10px 16px;font-weight:700;margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cta{background:var(--sea);color:#fff;border-radius:999px;padding:14px 26px;font-family:var(--display);font-weight:800;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.cta.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow)}
.cta.sm{font-size:17px;padding:10px 18px}
.cta.danger{background:var(--berry)}
.note{font-size:14px;color:var(--muted);text-align:center;margin:0}
.vnote{background:var(--warn-bg);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:15px}
.vnote summary{cursor:pointer;font-weight:700;color:var(--warn);margin-top:6px}
.vnote ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* pet */
.petcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:10px 16px;text-align:left;box-shadow:var(--shadow)}
.petcard:hover{border-color:var(--sea)}
.petcard .pe{position:relative;font-size:54px;line-height:1;width:64px;text-align:center}
.petcard b{font-family:var(--display);font-size:22px;display:block}
.petcard small{color:var(--muted);font-size:15px}
.petcard .go{margin-left:auto;font-weight:700;color:var(--sea);font-size:15px;white-space:nowrap}
.petcard.new .pe{animation:wob 2s infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.hatw{position:absolute;left:50%;top:-.42em;transform:translateX(-50%);font-size:.55em}
.petstage{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:220px;padding-top:40px}
.petbig{position:relative;line-height:1;cursor:pointer;transition:transform .2s}
.petbig.bounce{animation:bnc .6s}
@keyframes bnc{30%{transform:translateY(-24px) scale(1.08)}60%{transform:translateY(0) scale(.96)}}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 14px;font-weight:700;position:relative;max-width:30ch}
.hearts{font-size:24px;letter-spacing:2px}
.xpbar{width:100%;max-width:320px;height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sun);border-radius:999px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.shop button{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;box-shadow:var(--shadow)}
.shop button .ic{font-size:34px;line-height:1.1}
.shop button small{color:var(--muted);font-weight:700}
.shop button[aria-pressed="true"]{border-color:var(--leaf);background:var(--ok-bg)}
.shop button:disabled{opacity:.45;cursor:default}
.petgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.petgrid button{background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700}
.petgrid button .ic{font-size:48px;line-height:1.1}
.petgrid button[aria-pressed="true"]{border-color:var(--sea);background:color-mix(in srgb,var(--sea) 14%,var(--surface))}
.petline{background:color-mix(in srgb,var(--sun) 26%,var(--surface));border-radius:16px;padding:10px 16px;font-weight:700;margin:0}
/* fun */
.combo{background:var(--berry);color:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-family:var(--display);animation:pop .4s}
.timer{display:flex;align-items:center;gap:10px;margin-left:auto;flex:1;min-width:140px}
.tbar{flex:1;height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .25s linear}
.tbar i.low{background:var(--berry)}
.tnum{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right}
.lyn{font-size:46px;font-family:var(--display);font-weight:800;color:var(--sea)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
/* gender/age */
.ages{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.ages button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;font-family:var(--display);font-weight:800;font-size:18px}
.ages button[aria-pressed="true"]{border-color:var(--sea);background:var(--sea);color:#fff}
/* subject chooser */
.subj{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sbig{border-radius:28px;padding:22px 18px 18px;min-height:220px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .12s}

function prefs(p,mod){p.prefs=p.prefs||{};return p.prefs[mod]||(p.prefs[mod]={diff:"middels",mode:"blandet"})}
function hasModes(p,mod){return MODES[mod]&&!(mod==="mul"&&modState(p,mod).lvl<=2)}
function startGame(mod){const p=cur();const st=modState(p,mod),m=MODS[mod],pr=prefs(p,mod);const lvl=clamp(st.lvl+DIFF[pr.diff].d,m.min,m.max);
  const lyn=pr.play==="lyn";stopTimer();
  S.game={mod,lvl,diff:pr.diff,mode:hasModes(p,mod)?pr.mode:"blandet",lyn,endAt:lyn?Date.now()+LYN_SEK*1000:0,i:0,results:[],q:null,tries:0,locked:false,hinted:false,combo:0,bonus:0,t0:Date.now()};S.view="game";
  if(lyn)S.timer=setInterval(tickTimer,250);nextQ()}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function tickTimer(){const g=S.game;if(!g||!g.lyn||S.view!=="game"){stopTimer();return}const left=Math.max(0,g.endAt-Date.now());
  const bar=document.getElementById("tbar"),num=document.getElementById("tnum");if(bar){bar.style.width=(left/(LYN_SEK*10))+"%";bar.classList.toggle("low",left<10000)}if(num)num.textContent=Math.ceil(left/1000);
  if(left<=0&&!g.locked){stopTimer();endGame()}}
function endGame(){stopTimer();finishRound();S.view="end";render();tone([523,659,784,1047]);const e=S.lastEnd,n=e.n;
  if(e.lyn||n>=ROUND-1)confetti(e.lyn?60:120);
  say(e.lyn?(e.newBest?`Ny rekord! Du klarte ${n}!`:`Tiden er ute! Du klarte ${n}.`):e.petUp?`${cur().pet.name} vokste! Hurra!`:e.change==="up"?"Hurra! Du har gått opp et nivå!":n>=ROUND-1?"Fantastisk! Du er kjempeflink!":n>=ROUND/2?"Bra jobba!":"Godt forsøk! Vil du prøve igjen?")}
function confetti(n){try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return}catch(e){}
  let c=document.getElementById("confetti");if(!c){c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c)}
  const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext("2d");const cols=["#ffc23a","#d4336b","#2a76d2","#26a165","#7a4fd0","#e08a00"];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let t=0;(function fr(){t++;x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(t<110)requestAnimationFrame(fr);else c.remove()})()}
function finishRound(){
  const p=cur(),g=S.game,st=modState(p,g.mod),m=MODS[g.mod];const n=g.results.filter(Boolean).length,qn=g.results.length;
  st.rounds++;st.first+=n;st.total+=g.lyn?qn:ROUND;st.last=Date.now();
  let change=null,newBest=false;
  if(g.lyn){p.best=p.best||{};if(n>(p.best[g.mod]||0)){newBest=(p.best[g.mod]||0)>0||n>0;p.best[g.mod]=n}}
  let petUp=false;if(p.pet){const before=petLv(p.pet);p.pet.xp=(p.pet.xp||0)+n;p.pet.hearts=Math.min(5,(p.pet.hearts||3)+1);petUp=petLv(p.pet)>before}
  if(g.lyn||g.diff!=="middels"){}
  else if(n>=ROUND-1){st.up++;st.down=0;if(st.up>=2&&st.lvl<m.max){st.lvl++;st.up=0;change="up"}}
  else if(n<=3){st.down++;st.up=0;if(st.down>=2&&st.lvl>m.min){st.lvl--;st.down=0;change="down"}}
  else{st.up=0;st.down=0}
  p.hist.unshift({t:Date.now(),m:g.mod,n,q:qn,l:g.lvl,df:g.diff,md:g.mode,ly:g.lyn?1:0});p.hist=p.hist.slice(0,60);
  const d=today();p.days[d]=(p.days[d]||0)+1;
  const mins=Math.min(30,(Date.now()-g.t0)/60000);p.dmin=p.dmin||{};p.dmin[d]=Math.round(((p.dmin[d]||0)+mins)*10)/10;p.minutes=Math.round(((p.minutes||0)+mins)*10)/10;
  const mk=Object.keys(p.dmin).sort();while(mk.length>60)delete p.dmin[mk.shift()];
  const keys=Object.keys(p.days).sort();while(keys.length>60)delete p.days[keys.shift()];
  persist();S.lastEnd={n,qn,change,lvl:st.lvl,streakUp:!g.lyn&&g.diff==="middels"?st.up:0,diff:g.diff,lyn:g.lyn,newBest,petUp,xp:n,bonus:g.bonus};
}
function nextQ(){const g=S.game;if(g.lyn?Date.now()>=g.endAt:g.i>=ROUND){endGame();return}
  let q,guard=0;do{q=GEN[g.mod](g.lvl,g.mode)}while(g.q&&q.ans===g.q.ans&&guard++<6);if(q.choices)q.choices=q.choices.map(String);q.hint=autoHint(g.mod,q,g.lvl);q.removed=[];g.q=q;g.tries=0;g.hinted=false;g.locked=false;render();setTimeout(()=>say(q.speak),250)}
function correct(){const g=S.game,p=cur();g.locked=true;const first=g.tries===0;g.results.push(first);if(first){p.stars++;g.combo++}else g.combo=0;
  let extra="";if(first&&g.combo>0&&g.combo%5===0){p.stars++;g.bonus++;extra=` ${g.combo} på rad! Bonusstjerne!`;confetti(70);tone([660,880,1047,1319])}
  else if(first&&g.combo===3){extra=" Tre på rad!";confetti(35);tone([660,880,1047])}else{tone([660,880]);if(first)confetti(14)}
  persist();say((g.lyn?"":(g.q.sayAns?g.q.sayAns+". ":""))+pick(["Riktig!","Flott!","Supert!","Så bra!","Ja!"])+extra);
  const card=document.querySelector(".card");if(card)card.classList.add("ok","pop");
  const cb=document.getElementById("combo");if(cb){cb.textContent=g.combo>=2?`🔥 ${g.combo} på rad`:"";cb.hidden=g.combo<2}
  const sc=document.querySelector(".top .pill .st+span, #balnum");if(sc)sc.textContent=bal(p);
  setTimeout(()=>{if(S.game!==g)return;g.i++;nextQ()},g.lyn?650:1400)}
function useHint(){const g=S.game;if(!g||g.locked||g.hinted)return;const q=g.q;g.hinted=true;g.tries++;g.combo=0;
  if(q.spell){const i=q.tiles.findIndex(t=>!t.used&&t.ch===q.word[q.filled]);if(i>=0){q.tiles[i].used=true;q.filled++}}
  else{const left=q.choices.filter(c=>c!==String(q.ans)&&!q.removed.includes(c)&&!(q.wrongs||[]).includes(c));if(left.length>1||(left.length===1&&q.choices.length>2))q.removed.push(pick(left))}
  render();say(q.hint);if(q.spell&&q.filled===q.word.length)correct()}
function wrong(el){S.game.tries++;S.game.combo=0;const cb=document.getElementById("combo");if(cb)cb.hidden=true;if(el&&el.dataset.v){const q=S.game.q;q.wrongs=q.wrongs||[];q.wrongs.push(el.dataset.v)}tone([220,180]);say("Prøv igjen");if(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}}

  let body;

  return`<div class="bar"><button class="back" data-act="home">← Hjem</button><h2 style="font-size:20px">${m.title}</h2><button class="hintbtn" data-act="hint" ${g.hinted||g.locked?"disabled":""}>💡 Tips</button><span class="combo" id="combo" ${g.combo>=2?"":"hidden"}>🔥 ${g.combo} på rad</span>${g.lyn?(()=>{const left=Math.max(0,g.endAt-Date.now());return`<div class="timer" aria-label="Tid igjen"><span>⚡ ${g.results.filter(Boolean).length}</span><div class="tbar"><i id="tbar" class="${left<10000?"low":""}" style="width:${left/(LYN_SEK*10)}%"></i></div><span class="tnum" id="tnum">${Math.ceil(left/1000)}</span></div>`})():`<div class="dots" aria-label="Oppgave ${g.i+1} av ${ROUND}">${dots}</div>`}</div>${body}`
}

  const bon=e.bonus?`<p class="note">+${e.bonus} bonusstjerne${e.bonus>1?"r":""} for 5 riktige på rad 🔥</p>`:"";
  if(e.lyn)return header()+`<div class="card end"><div class="lyn">⚡ ${n}</div><h1 style="font-size:30px">${e.newBest?"Ny rekord! 🏆":"Tiden er ute!"}</h1>
<p style="margin:0">Du klarte <b>${n}</b> riktige på ${LYN_SEK} sekunder.${(p.best||{})[g.mod]&&!e.newBest?` Rekorden din er ${(p.best||{})[g.mod]}.`:""}</p>${bon}${petl}
<div class="row"><button class="cta" data-act="play" data-mod="${g.mod}">Prøv igjen</button><button class="cta alt" data-act="home">Hjem</button></div></div>`;
  const msg=e.change==="up"?`<p class="lvup">Nytt nivå! Nå øver du på nivå ${e.lvl}.</p>`:e.change==="down"?`<p class="lvup">Vi går et nivå ned og øver litt mer på nivå ${e.lvl}.</p>`:e.streakUp===1?`<p class="note">Én runde til med 7 eller 8 riktige, så går du opp et nivå!</p>`:"";
  return header()+`<div class="card end"><h1 style="font-size:34px">${n>=ROUND-1?"Fantastisk!":n>=ROUND/2?"Bra jobba!":"Godt forsøk!"}</h1>
<div class="stars" aria-label="${n} av ${ROUND} stjerner">${"★".repeat(n)}<span class="off">${"★".repeat(ROUND-n)}</span></div>
<p style="margin:0">Du fikk <b>${n} av ${ROUND}</b> riktige på første forsøk.</p>${msg}${bon}${petl}${e.diff!=="middels"?`<p class="note">Du spilte på ${DIFF[e.diff].name.toLowerCase()}. Nivået endres bare på middels.</p>`:""}
<div class="row"><button class="cta" data-act="play" data-mod="${g.mod}">Spill igjen</button><button class="cta alt" data-act="home">Hjem</button></div></div>`}

function vAbc(){const sel=LETTERS[S.abcSel];
  return`<div class="bar"><button class="back" data-act="home">← Hjem</button><h2 style="font-size:22px">Alfabetet</h2></div>
<div class="card"><div class="show"><div class="pair">${sel[0]}<span>${sel[0].toLowerCase()}</span></div><div class="hero">${sel[2]}</div></div>
<div class="word">${sel[0]} som i <b>${sel[1]}</b></div>${spk}</div>
<div class="abc">${LETTERS.map((l,k)=>`<button data-act="letter" data-i="${k}" class="${S.abcSel===k?"sel":""} ${"ÆØÅ".includes(l[0])?"nordic":""}">${l[0]}</button>`).join("")}</div>
<p class="note">Æ, Ø og Å er de tre norske bokstavene til slutt i alfabetet.</p>`}

function vGate(){const gt=S.gate;
  return`<div class="bar"><button class="back" data-act="pickview">← Tilbake</button><h2 style="font-size:22px">For foreldre</h2></div>
<form class="form" id="gateform" autocomplete="off"><p style="margin:0">Denne delen er for voksne. Svar på regnestykket for å gå videre.</p>
<div class="field"><label class="label" for="gate">Hva er ${gt.a} × ${gt.b}?</label><input class="inp" id="gate" inputmode="numeric" pattern="[0-9]*" maxlength="4"></div>
${gt.err?`<p class="err">Feil svar. Prøv igjen.</p>`:""}<button class="cta" type="submit">Åpne</button></form>`}

function pct(a,b){return b?Math.round(a/b*100):0}
function ago(t){if(!t)return"–";const d=Math.floor((Date.now()-t)/864e5);return d<=0?"I dag":d===1?"I går":d+" dager siden"}
function vParent(){
  const days=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);return d});
  const wd=["søn","man","tir","ons","tor","fre","lør"];
  const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const cards=DB.profiles.map(p=>{
    const vals=days.map(d=>p.days[key(d)]||0),mx=Math.max(3,...vals),week=vals.reduce((a,b)=>a+b,0);
    const all=Object.values(p.mods).reduce((a,s)=>({f:a.f+s.first,t:a.t+s.total,r:a.r+s.rounds}),{f:0,t:0,r:0});
    const rows=["no","ma"].flatMap(sj=>Object.keys(MODS).filter(k=>MODS[k].s===sj&&!MODS[k].free&&(p.mods[k]||(p.grade>=MODS[k].min&&p.grade<=MODS[k].max)))).map(k=>{const s=p.mods[k];const m=MODS[k];
      if(!s||!s.rounds)return`<tr><td>${m.title}<div class="sub">${m.s==="no"?"Norsk":"Matte"}</div></td><td class="n">${s?s.lvl:clamp(p.grade,m.min,m.max)}</td><td class="n">0</td><td class="n">–</td><td><span class="chip new">Ikke prøvd</span></td></tr>`;
      const a=pct(s.first,s.total);const chip=s.rounds>=2&&a<60?'<span class="chip warn">Trenger øving</span>':a>=85?'<span class="chip good">Sterk</span>':'<span class="chip new">På vei</span>';
      return`<tr><td>${m.title}<div class="sub">${m.s==="no"?"Norsk":"Matte"} · ${ago(s.last)}</div></td><td class="n">${s.lvl}</td><td class="n">${s.rounds}</td><td class="n">${a} %</td><td>${chip}</td></tr>`}).join("");
    const recent=p.hist.slice(0,6).map(h=>`<tr><td>${new Date(h.t).toLocaleDateString("nb-NO",{day:"numeric",month:"short"})}</td><td>${MODS[h.m]?MODS[h.m].title:h.m}</td><td class="n">Nivå ${h.l}${h.df&&h.df!=="middels"?" · "+DIFF[h.df].name:""}</td><td class="n">${h.ly?"⚡ "+h.n:h.n+"/"+ROUND}</td></tr>`).join("");
    const conf=S.confirmDel===p.id?`<div class="confirm"><span>Slette <b>${esc(p.name)}</b> og all fremgang? Dette kan ikke angres.</span><div class="prow"><button class="cta sm danger" data-act="del" data-id="${p.id}">Slett</button><button class="cta sm alt" data-act="nodel">Avbryt</button></div></div>`:"";
    return`<section class="pcard"><div class="phead"><span class="av">${p.av}</span><div><h2>${esc(p.name)}</h2><div class="meta">${p.grade}. trinn${p.age?` · ${p.age} år`:""}${GNAME[p.gender]?` · ${GNAME[p.gender]}`:""} · ★ ${p.stars} stjerner</div></div></div>
<div class="kpis"><div class="kpi"><b>${week}</b><span>runder siste 7 dager</span></div><div class="kpi"><b>${Math.round(days.reduce((a,d)=>a+((p.dmin||{})[key(d)]||0),0))}</b><span>minutter siste 7 dager</span></div><div class="kpi"><b>${all.r}</b><span>runder totalt</span></div><div class="kpi"><b>${all.t?pct(all.f,all.t)+" %":"–"}</b><span>riktig på første forsøk</span></div></div>
<div><span class="label">Siste 7 dager</span><div class="week">${vals.map((v,k)=>`<div><b style="color:var(--ink);font-size:12px">${v||""}</b><i class="${v?"":"zero"}" style="height:${v?Math.max(8,v/mx*60):3}px"></i>${wd[days[k].getDay()]}</div>`).join("")}</div></div>
<div><span class="label">Fag og nivå</span><div class="tbl"><table><thead><tr><th>Øvelse</th><th class="n">Nivå</th><th class="n">Runder</th><th class="n">Riktig</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>
${recent?`<div><span class="label">Siste runder</span><div class="tbl"><table><tbody>${recent}</tbody></table></div></div>`:""}
<div class="field"><span class="label">Kjønn</span><div class="seg3">${GENDERS.map(([v,n])=>`<button data-act="setgender" data-id="${p.id}" data-v="${v}" aria-pressed="${(p.gender||"")===v}">${n}</button>`).join("")}</div></div>
<div class="field"><span class="label">Alder</span><div class="ages">${AGES.map(n=>`<button data-act="setage" data-id="${p.id}" data-v="${n}" aria-pressed="${p.age===n}">${n}</button>`).join("")}</div></div>
<div class="field"><span class="label">Endre trinn</span><div class="grades">${[1,2,3,4,5,6,7].map(n=>`<button data-act="setgrade" data-id="${p.id}" data-g="${n}" aria-pressed="${p.grade===n}">${n}</button>`).join("")}</div><span class="sub">Nytt trinn setter nivået på alle øvelser til det trinnet. Statistikken beholdes.</span></div>
${conf||`<div class="prow"><button class="cta sm alt" data-act="askdel" data-id="${p.id}">Slett spiller</button></div>`}</section>`}).join("");
  const rk=DB.profiles.map(p=>({p,r:days.reduce((a,d)=>a+(p.days[key(d)]||0),0),m:Math.round(days.reduce((a,d)=>a+((p.dmin||{})[key(d)]||0),0))})).sort((a,b)=>b.m-a.m||b.r-a.r);
  const rank=DB.profiles.length>1?`<section class="pcard"><h2 style="font-size:22px">Hvem øver mest denne uka?</h2><div class="rank">${rk.map((x,i)=>`<div><span class="av">${x.p.av}</span><b>${i===0&&x.r?"🏆 ":""}${esc(x.p.name)}</b><span class="r">${x.m} min<br>${x.r} runder</span></div>`).join("")}</div></section>`:"";
  return`<div class="bar"><button class="back" data-act="pickview">← Spillere</button><h2 style="font-size:22px">Foreldreoversikt</h2></div>
${rank}${cards||'<p>Ingen spillere ennå.</p>'}
<div class="info"><b style="color:var(--ink)">Slik fungerer Lærelek</b><ul>
<li>Oppgavene følger kompetansemålene i norsk og matematikk for 1.–7. trinn (LK20).</li>
<li>Hver øvelse har sitt eget nivå. Barnet går opp etter to runder på rad med 7–8 av 8 riktige, og ned etter to runder på rad med 3 eller færre.</li>
<li>Kjæledyret får 1 XP for hvert riktige svar og vokser i tre stadier. Stjerner kan brukes på mat og hatter. Stjernene kan ikke kjøpes for penger.</li>
<li>Lynrunde: så mange riktige som mulig på ${LYN_SEK} sekunder. Lynrunder endrer ikke nivået.</li>
<li>Barnet kan velge lett, middels eller vanskelig før hver runde. Nivået justeres automatisk bare på middels. Bruker barnet tips, gir den oppgaven ingen stjerne.</li>
<li>«Trenger øving» vises når barnet har under 60 % riktig på første forsøk etter minst to runder.</li>
<li>Kjønn (gutt, jente eller annet) og alder er valgfritt. Velger barnet gutt eller jente, får det blå eller rosa farge som start, men alle farger kan velges under Mitt tema.</li>
<li>All fremgang, kjønn, alder, valgt farge og eventuelt bakgrunnsbilde lagres bare på denne enheten. Ingenting sendes til internett, og det trengs ingen konto.</li>
<li>Opplesning bruker enhetens norske stemme. Finnes den ikke, brukes svensk eller dansk stemme, ellers slås opplesningen av. Appen leser aldri opp med engelsk stemme.</li></ul></div>${voiceNote()}`}

function render(){const app=document.getElementById("app");if(!cur()&&["home","game","end","abc"].includes(S.view))S.view="pick";
  app.innerHTML={pick:vPick,new:vNew,home:vHome,game:vGame,end:vEnd,abc:vAbc,gate:vGate,parent:vParent,setup:vSetup,theme:vTheme,pet:vPet,petnew:vPetNew}[S.view]();applyTheme();if(S.view!=="game")stopTimer()}
const bgMem={};
function bgGet(id){if(id in bgMem)return bgMem[id];try{return bgMem[id]=localStorage.getItem("laerelek_bg_"+id)||""}catch(e){return""}}
function applyTheme(){const p=["pick","new","gate","parent"].includes(S.view)?null:cur();document.body.className=p&&p.theme?"th-"+p.theme:"";
  let el=document.getElementById("bgimg");const img=p?bgGet(p.id):"";
  if(img){if(!el){el=document.createElement("div");el.id="bgimg";document.body.prepend(el)}el.style.backgroundImage=`url('${img}')`}else if(el)el.remove()}
function loadBg(file){const p=cur();if(!p||!file)return;S.bgErr="";const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1200/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      const url=c.toDataURL("image/jpeg",.75);bgMem[p.id]=url;try{localStorage.setItem("laerelek_bg_"+p.id,url)}catch(e){S.bgErr="Bildet ble for stort til å lagres. Det vises bare til appen lukkes."}render()};
    im.onerror=()=>{S.bgErr="Kunne ikke lese bildet. Prøv et annet.";render()};im.src=rd.result};rd.readAsDataURL(file)}

// ================= hendelser =================
const app=document.getElementById("app");
app.addEventListener("input",e=>{if(e.target.id==="pname"&&S.form)S.form.name=e.target.value});
app.addEventListener("input",e=>{if(e.target.id==="petname"&&S.petForm)S.petForm.name=e.target.value});
app.addEventListener("change",e=>{if(e.target.id==="bgfile"&&e.target.files&&e.target.files[0])loadBg(e.target.files[0])});
app.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.id==="newform"){const f=S.form;f.name=(document.getElementById("pname").value||"").trim();
    if(!f.name){f.err="Skriv inn et navn.";render();return}if(!f.grade){f.err="Velg trinn.";render();return}
    const p={id:"p"+Date.now().toString(36),name:f.name,av:f.av,grade:f.grade,gender:f.gender||"",age:f.age||null,theme:GTHEME[f.gender]||"",stars:0,mods:{},hist:[],days:{}};DB.profiles.push(p);DB.cur=p.id;persist();S.form=null;S.tab=null;S.view="home";render();say(`Hei, ${p.name}!`)}
  if(e.target.id==="petform"){const f=S.petForm,p=cur();const nm=(document.getElementById("petname").value||"").trim()||PETS[f.t].def;
    p.pet={t:f.t,name:nm,xp:0,hearts:4,seen:today(),hat:"",hats:[]};persist();S.petSay=`Hei! Jeg heter ${esc(nm)}. Svar riktig, så vokser jeg!`;S.view="pet";render();say(`Hei! Jeg heter ${nm}.`);confetti(80)}
  if(e.target.id==="gateform"){const v=+document.getElementById("gate").value;if(v===S.gate.a*S.gate.b){S.view="parent";S.confirmDel=null;render();window.scrollTo(0,0)}else{S.gate={a:rand(12,19),b:rand(3,9),err:true};render();const i=document.getElementById("gate");if(i)i.focus()}}
});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="sound"){DB.sound=!DB.sound;persist();if(!DB.sound)try{speechSynthesis.cancel()}catch(e){}render()}
  else if(a==="choose"){DB.cur=b.dataset.id;persist();S.view="home";S.tab=null;render();const p=cur();say(`Hei, ${p.name}!`)}
  else if(a==="new"){S.form={name:"",av:pick(AVATARS),grade:null,gender:null,age:null,err:""};S.view="new";render();const i=document.getElementById("pname");if(i)i.focus()}
  else if(a==="fav"){S.form.av=b.dataset.a;render()}
  else if(a==="fgender"){S.form.gender=b.dataset.v;render()}
  else if(a==="fage"){S.form.age=+b.dataset.v;render()}
  else if(a==="setgender"){const p=DB.profiles.find(x=>x.id===b.dataset.id);if(p){const old=GTHEME[p.gender]||"";p.gender=b.dataset.v;if((p.theme||"")===old)p.theme=GTHEME[p.gender]||"";persist();render()}}
  else if(a==="setage"){const p=DB.profiles.find(x=>x.id===b.dataset.id);if(p){p.age=p.age===+b.dataset.v?null:+b.dataset.v;persist();render()}}
  else if(a==="fgrade"){S.form.grade=+b.dataset.g;S.form.err="";render()}
  else if(a==="pickview"){try{speechSynthesis.cancel()}catch(e){}S.view="pick";render()}
  else if(a==="parents"){S.gate={a:rand(12,19),b:rand(3,9),err:false};S.view="gate";render();const i=document.getElementById("gate");if(i)i.focus()}
  else if(a==="setgrade"){const p=DB.profiles.find(x=>x.id===b.dataset.id);if(p){p.grade=+b.dataset.g;Object.keys(p.mods).forEach(k=>{const m=MODS[k];Object.assign(p.mods[k],{lvl:clamp(p.grade,m.min,m.max),up:0,down:0})});persist();render()}}
  else if(a==="askdel"){S.confirmDel=b.dataset.id;render()}
  else if(a==="nodel"){S.confirmDel=null;render()}
  else if(a==="del"){try{localStorage.removeItem("laerelek_bg_"+b.dataset.id)}catch(e){}delete bgMem[b.dataset.id];DB.profiles=DB.profiles.filter(x=>x.id!==b.dataset.id);if(DB.cur===b.dataset.id)DB.cur=null;persist();S.confirmDel=null;render()}
  else if(a==="tab"){S.tab=b.dataset.t;render();window.scrollTo(0,0)}
  else if(a==="subjects"){S.tab=null;render();window.scrollTo(0,0)}
  else if(a==="play"){startGame(b.dataset.mod);window.scrollTo(0,0)}
  else if(a==="setup"){S.setupMod=b.dataset.mod;S.view="setup";render();window.scrollTo(0,0)}
  else if(a==="pdiff"){prefs(cur(),S.setupMod).diff=b.dataset.v;persist();render()}
  else if(a==="pmode"){prefs(cur(),S.setupMod).mode=b.dataset.v;persist();render()}
  else if(a==="hint"){useHint()}
  else if(a==="pplay"){prefs(cur(),S.setupMod).play=b.dataset.v;persist();render()}
  else if(a==="petnew"){S.petForm={t:"drage",name:PETS.drage.def};S.view="petnew";render();window.scrollTo(0,0)}
  else if(a==="ppet"){const old=S.petForm;const wasDef=!old.name||old.name===PETS[old.t].def;old.t=b.dataset.v;if(wasDef)old.name=PETS[old.t].def;render()}
  else if(a==="pet"){S.petSay="";S.view="pet";render();window.scrollTo(0,0)}
  else if(a==="petpat"){const p=cur();S.petSay=pick(["Det kiler! 😄","Mmm, så godt!","Jeg er glad i deg!","Hihi!","Mer kos!"]);render();const el=document.getElementById("petbig");if(el)el.classList.add("bounce");tone([880,1175]);say(S.petSay.replace(/[^\p{L}\p{N}\s!.,]/gu,""))}
  else if(a==="feed"){const p=cur(),f=FOOD.find(x=>x[0]===b.dataset.v);if(f&&bal(p)>=f[3]&&p.pet.hearts<5){p.spent=(p.spent||0)+f[3];p.pet.hearts=Math.min(5,p.pet.hearts+f[4]);persist();S.petSay=`Nam nam! Takk for ${f[2].toLowerCase()}! ${f[1]}`;render();const el=document.getElementById("petbig");if(el)el.classList.add("bounce");tone([523,659,784]);say(`Nam nam! Takk!`)}}
  else if(a==="hat"){const p=cur(),h=HATS.find(x=>x[0]===b.dataset.v),pet=p.pet;pet.hats=pet.hats||[];if(!h)return;
    if(pet.hats.includes(h[0])){pet.hat=pet.hat===h[0]?"":h[0];S.petSay=pet.hat?"Så fin jeg ble!":"Nå er jeg uten hatt."}
    else if(bal(p)>=h[3]){p.spent=(p.spent||0)+h[3];pet.hats.push(h[0]);pet.hat=h[0];S.petSay=`Wow, en ${h[2].toLowerCase()}! Tusen takk!`;confetti(50);tone([523,659,784,1047])}
    persist();render();say(S.petSay)}
  else if(a==="theme"){S.bgErr="";S.view="theme";render();window.scrollTo(0,0)}
  else if(a==="pav"){cur().av=b.dataset.a;persist();render()}
  else if(a==="ptheme"){cur().theme=b.dataset.v;persist();render()}
  else if(a==="bgremove"){const p=cur();delete bgMem[p.id];try{localStorage.removeItem("laerelek_bg_"+p.id)}catch(e){}render()}
  else if(a==="home"){try{speechSynthesis.cancel()}catch(e){}stopTimer();S.view="home";S.game=null;render()}
  else if(a==="abc"){S.view="abc";S.abcSel=0;render();window.scrollTo(0,0)}
  else if(a==="letter"){S.abcSel=+b.dataset.i;render();const l=LETTERS[S.abcSel];say(`${l[0]}. ${l[0]} som i ${l[1]}.`)}
  else if(a==="speak"){if(S.view==="abc"){const l=LETTERS[S.abcSel];say(`${l[0]}. ${l[0]} som i ${l[1]}.`)}else if(S.game)say(S.game.q.speak)}
  else if(a==="answer"){const g=S.game;if(!g||g.locked||b.classList.contains("wrong")||b.classList.contains("removed"))return;
    if(b.dataset.v===String(g.q.ans)){b.classList.add("right");correct()}else{b.classList.add("wrong");wrong(b)}}
  else if(a==="tile"){const g=S.game;if(!g||g.locked)return;const q=g.q,t=q.tiles[+b.dataset.i];
    if(t.ch===q.word[q.filled]){t.used=true;q.filled++;tone([700]);render();if(q.filled===q.word.length)correct()}
    else wrong(b)}
});
if(cur())S.view="home";
render();
})();
</script>
